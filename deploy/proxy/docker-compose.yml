version: '3.8'

services:
  favicon-proxy:
    image: nginx:alpine
    container_name: passapp-favicon-proxy
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./cache:/var/cache/nginx
    environment:
      - TZ=Europe/Paris
