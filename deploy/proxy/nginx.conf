events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=favicon_cache:10m max_size=200m inactive=7d use_temp_path=off;

    server {
        listen 443 ssl;
        server_name passapp-proxy.local;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        location /favicon {
            resolver 1.1.1.1 8.8.8.8 ipv6=off;
            
            # Récupère l'URL demandée via argument ?url=
            set $target_domain $arg_domain;
            
            proxy_pass https://$target_domain/favicon.ico;
            proxy_set_header Host $target_domain;
            proxy_set_header User-Agent "PassApp-Favicon-Proxy/1.0";
            
            proxy_cache favicon_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1h;
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie Cache-Control;
            
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
