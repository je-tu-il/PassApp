name: Build PassApp (4 Apps)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------
  # JOB 1 : TESTS DU NOYAU ET DES CONTRATS
  # -------------------------------------------------------------
  test-core:
    name: Tests & Lint (Core, Sync, Contracts)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation des dépendances système Linux (GTK 3, WebKit, pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Vérification du formatage Rust
        run: cargo fmt --all -- --check

      - name: Exécution des tests unitaires et d'intégration
        run: cargo test --workspace

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances Frontend
        run: npm ci
        working-directory: apps/desktop

      - name: Lint Frontend
        run: npm run lint
        working-directory: apps/desktop

      - name: Typecheck et Build des contrats
        run: npx --package=typescript tsc -p packages/contracts/tsconfig.json

  # -------------------------------------------------------------
  # JOB 2 : APPLICATION DESKTOP WINDOWS (.exe, .msi)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop
    needs: test-core
    runs-on: windows-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-

      - name: Installation des dépendances npm
        run: npm ci
        working-directory: apps/desktop

      - name: Compilation Frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Build Tauri Desktop (Windows)
        run: npx @tauri-apps/cli build
        working-directory: apps/desktop

      - name: Rassemblement des livrables Windows
        shell: bash
        run: |
          mkdir -p dist-windows
          find target apps/desktop/src-tauri/target -type f \( -name "*.msi" -o -name "*setup*.exe" -o -name "PassApp.exe" \) ! -name "*build*.exe" ! -name "app.exe" -exec cp {} dist-windows/ \; || true
          ls -la dist-windows/

      - name: Archivage des livrables Windows
        uses: actions/upload-artifact@v4
        with:
          name: PassApp-Windows-x64
          path: dist-windows/*
          if-no-files-found: warn

  # -------------------------------------------------------------
  # JOB 3 : APPLICATION DESKTOP MACOS (.dmg, .app)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS Desktop
    needs: test-core
    runs-on: macos-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-macos-

      - name: Installation des dépendances npm
        run: npm ci
        working-directory: apps/desktop

      - name: Compilation Frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Build Tauri Desktop (macOS)
        run: npx @tauri-apps/cli build
        working-directory: apps/desktop

      - name: Rassemblement des livrables macOS
        run: |
          mkdir -p dist-macos
          find target apps/desktop/src-tauri/target -type f -name "*.dmg" -exec cp {} dist-macos/ \; || true
          ls -la dist-macos/

      - name: Archivage des livrables macOS
        uses: actions/upload-artifact@v4
        with:
          name: PassApp-macOS-Universal
          path: dist-macos/*
          if-no-files-found: warn

  # -------------------------------------------------------------
  # JOB 4 : APPLICATION DESKTOP LINUX (.AppImage, .deb)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop
    needs: test-core
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation des dépendances système Linux (WebKit, GTK 3, AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-linux-

      - name: Installation des dépendances npm
        run: npm ci
        working-directory: apps/desktop

      - name: Compilation Frontend
        run: npm run build
        working-directory: apps/desktop

      - name: Build Tauri Desktop (Linux)
        run: npx @tauri-apps/cli build
        working-directory: apps/desktop

      - name: Rassemblement des livrables Linux
        run: |
          mkdir -p dist-linux
          find target apps/desktop/src-tauri/target -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-linux/ \; || true
          ls -la dist-linux/

      - name: Archivage des livrables Linux
        uses: actions/upload-artifact@v4
        with:
          name: PassApp-Linux-x64
          path: dist-linux/*
          if-no-files-found: warn

  # -------------------------------------------------------------
  # JOB 5 : APPLICATION MOBILE IOS (Compilation native ARM64 & AltStore IPA)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS App (SwiftUI & AltStore Sideload)
    needs: test-core
    runs-on: macos-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Sélection de la version Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Compilation et archivage iOS pour AltStore / SideStore
        run: |
          mkdir -p build/ios
          xcodebuild -project apps/ios/PassApp.xcodeproj \
            -scheme PassApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/PassApp.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          mkdir -p build/ios/Payload
          cp -R build/ios/PassApp.xcarchive/Products/Applications/PassApp.app build/ios/Payload/
          cd build/ios
          zip -qr PassApp-AltStore.ipa Payload
          ls -lh PassApp-AltStore.ipa

      - name: Archivage du bundle iOS
        uses: actions/upload-artifact@v4
        with:
          name: PassApp-iOS-Sideload
          path: build/ios/PassApp-AltStore.ipa
          if-no-files-found: error

  # -------------------------------------------------------------
  # JOB 6 : PUBLICATION AUTOMATIQUE DE LA RELEASE GITHUB
  # -------------------------------------------------------------
  release:
    name: Publication de la Release GitHub (Téléchargement direct)
    needs: [build-windows, build-macos, build-linux, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Téléchargement de tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rassemblement des fichiers finaux
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.ipa" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Publication de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "PassApp v0.1.0 - Multiplatform Release"
          body: |
            ## Livrables officiels PassApp v0.1.0 🔐
            
            Les applications compilées pour l'ensemble des plateformes sont disponibles en téléchargement direct ci-dessous :
            
            - 🪟 **Windows (x64)** : `.exe` (installateur NSIS) ou `.msi`
            - 🍏 **macOS (Universal / Apple Silicon & Intel)** : `.dmg` (image disque installable)
            - 🐧 **Linux (x64)** : `.AppImage` (exécutable direct sans installation) ou `.deb` (Ubuntu / Debian)
            - 📱 **iOS (iPhone & iPad)** : `PassApp-AltStore.ipa` (binaire natif compilé ARM64 prêt pour installation via AltStore, SideStore, Sideloadly ou TrollStore)
            
            ### Fonctionnalités intégrées :
            - 🔒 **Chiffrement symétrique de niveau militaire** : AES-256-GCM avec tag MAC 128 bits et dérivation de clé Argon2id (19 Mo, 2 itérations).
            - ⚡ **Analyseur de robustesse & entropie en direct** : calcul de la complexité (bits) et détection des faiblesses.
            - 🎲 **Générateur de mots de passe hautement paramétrable** : longueur (8 à 48 car.), minuscules, majuscules, chiffres, symboles et exclusion des caractères ambigus.
            - 🛡️ **Presse-papier auto-nettoyant** : compte à rebours de 30 secondes avec vidage automatique en mémoire pour prévenir toute fuite.
            - ⏱️ **Verrouillage automatique par inactivité** : protège vos secrets dès que vous quittez votre poste.
            - 💾 **Sauvegarde & Migration faciles** : export et import de sauvegardes sécurisées JSON.
            - 🔄 **Architecture Local-First** : vos données restent chez vous, sans cloud imposé ni abonnement.
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
